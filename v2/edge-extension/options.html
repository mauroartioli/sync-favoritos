<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sync Favoritos (v2) - Opções</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 24px; max-width: 780px; }
      code { background: #f2f2f2; padding: 2px 6px; border-radius: 6px; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; }
      .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
      button { padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; background: #0a66c2; color: white; font-weight: 600; }
      .muted { color: #666; margin-top: 6px; }
      .ok { color: #137333; }
    </style>
  </head>
  <body>
    <h1>Sync Favoritos (v2) - Opções</h1>
    <p class="muted">
      Dica: o gateway roda em <code>http://127.0.0.1:5003</code> e pode exigir token (<code>X-SF-Token</code>).
    </p>

    <label for="endpoint">Endpoint</label>
    <input id="endpoint" placeholder="http://127.0.0.1:5003/safari_bookmarks.json" />

    <label for="token">Token (opcional)</label>
    <input id="token" placeholder="Cole o token do config.json (se aplicável)" />

    <div class="row">
      <button id="save">Salvar</button>
      <span id="status" class="muted"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
